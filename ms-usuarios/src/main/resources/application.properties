spring.application.name=ms-usuarios
server.port=8081

# Oracle XE local. El listener de este equipo escucha en host.docker.internal;
# en otro equipo basta con definir DB_HOST=localhost.
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:host.docker.internal}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
spring.datasource.username=${DB_USER:FORO}
spring.datasource.password=${DB_PASSWORD:foro_local_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas las crea database/02_esquema_y_datos.sql; Hibernate solo verifica que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# La clave debe ser la misma en ms-usuarios y ms-foros (minimo 32 caracteres).
# El valor por defecto es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:clave-local-solo-para-desarrollo-foro-2026}
app.jwt.issuer=ms-usuarios
app.jwt.expiracion-minutos=60

app.cors.origen=${CORS_ORIGEN:http://localhost:4200}

management.endpoints.web.exposure.include=health

logging.level.root=INFO
logging.level.com.duoc.foro=DEBUG
