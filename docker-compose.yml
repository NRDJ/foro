# Levanta el frontend y los tres microservicios en contenedores:
#   docker compose up -d --build
# La base de datos es el Oracle XE instalado en el equipo (fuera de Docker): los contenedores
# llegan a él por host.docker.internal. Para otra base, define DB_HOST o DB_URL (por ejemplo, Oracle Cloud).
#
# Para publicar en Docker Hub: define REGISTRO con tu usuario y ejecuta "docker compose build" y "docker compose push".

x-backend: &backend
  restart: unless-stopped
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &entorno
    DB_HOST: ${DB_HOST:-host.docker.internal}
    DB_PORT: ${DB_PORT:-1521}
    DB_SERVICE: ${DB_SERVICE:-XEPDB1}
    DB_USER: ${DB_USER:-FORO}
    DB_PASSWORD: ${DB_PASSWORD:-foro_local_2026}
    JWT_SECRET: ${JWT_SECRET:-clave-local-solo-para-desarrollo-foro-2026}
    CORS_ORIGEN: ${CORS_ORIGEN:-http://localhost:4200}
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://localhost:$$SERVER_PORT/actuator/health | grep -q UP"]
    interval: 15s
    timeout: 5s
    retries: 10
    start_period: 40s

services:
  ms-usuarios:
    <<: *backend
    build: ./ms-usuarios
    image: ${REGISTRO:-foro}/ms-usuarios:2.0.0
    ports:
      - "8081:8081"
    environment:
      <<: *entorno
      SERVER_PORT: 8081

  ms-foros:
    <<: *backend
    build: ./ms-foros
    image: ${REGISTRO:-foro}/ms-foros:2.0.0
    ports:
      - "8082:8082"
    environment:
      <<: *entorno
      SERVER_PORT: 8082

  ms-moderacion:
    <<: *backend
    build: ./ms-moderacion
    image: ${REGISTRO:-foro}/ms-moderacion:2.0.0
    ports:
      - "8083:8083"
    environment:
      <<: *entorno
      SERVER_PORT: 8083
      # Dentro de la red de Docker, ms-foros se alcanza por el nombre del servicio
      FOROS_URL: http://ms-foros:8082
    depends_on:
      ms-foros:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ${REGISTRO:-foro}/frontend:2.0.0
    restart: unless-stopped
    ports:
      - "4200:8080"
