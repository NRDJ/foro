<div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-4">
  <h1 class="h3 mb-0"><i class="bi bi-people"></i> Usuarios</h1>
  <button class="btn btn-primary" type="button" (click)="creando.set(!creando())">
    <i class="bi" [class.bi-person-plus]="!creando()" [class.bi-x-lg]="creando()"></i> {{ creando() ? 'Cerrar' : 'Nuevo usuario' }}
  </button>
</div>

@if (aviso(); as a) {
  <div class="alert alert-dismissible" [class.alert-success]="a.tipo === 'success'" [class.alert-danger]="a.tipo === 'danger'" role="status">
    {{ a.texto }} <button type="button" class="btn-close" aria-label="Cerrar" (click)="aviso.set(null)"></button>
  </div>
}

@if (creando()) {
  <form class="card panel mb-4" [formGroup]="form" (ngSubmit)="crear()" novalidate>
    <div class="card-body p-4">
      <h2 class="h5 mb-3">Crear usuario</h2>
      <div class="row g-3">
        <div class="col-12 col-md-6 col-lg-4">
          <label for="n-nombre" class="form-label">Nombre completo</label>
          <input id="n-nombre" class="form-control" formControlName="nombre" required maxlength="100"
                 [class.is-invalid]="form.controls.nombre.invalid && form.controls.nombre.touched" />
          <app-error-campo [control]="form.controls.nombre" patron="Solo letras, espacios, apóstrofo o guion" />
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <label for="n-username" class="form-label">Nombre de usuario</label>
          <input id="n-username" class="form-control" formControlName="username" required maxlength="50"
                 [class.is-invalid]="form.controls.username.invalid && form.controls.username.touched" />
          <app-error-campo [control]="form.controls.username" patron="Usa de 3 a 50 letras, números, punto, guion o guion bajo" />
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <label for="n-email" class="form-label">Correo</label>
          <input id="n-email" type="email" class="form-control" formControlName="email" required maxlength="120"
                 [class.is-invalid]="form.controls.email.invalid && form.controls.email.touched" />
          <app-error-campo [control]="form.controls.email" patron="Ingresa un correo válido, por ejemplo nombre@dominio.cl" />
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <label for="n-password" class="form-label">Contraseña inicial</label>
          <input id="n-password" type="password" class="form-control" formControlName="password" autocomplete="new-password" required
                 [class.is-invalid]="form.controls.password.invalid && form.controls.password.touched" />
          <app-requisitos-password [control]="form.controls.password" />
        </div>
        <div class="col-12 col-md-6 col-lg-4">
          <label for="n-rol" class="form-label">Rol</label>
          <select id="n-rol" class="form-select" formControlName="rol" required>
            <option value="USUARIO">USUARIO</option>
            <option value="ADMIN">ADMIN</option>
          </select>
        </div>
        <div class="col-12 col-lg-4 d-flex align-items-end">
          <button class="btn btn-primary w-100" type="submit">Crear usuario</button>
        </div>
      </div>
    </div>
  </form>
}

<div class="row g-2 mb-3">
  <div class="col-12 col-md-8">
    <label for="buscar" class="visually-hidden">Buscar usuario</label>
    <input #b id="buscar" class="form-control" type="search" placeholder="Buscar por usuario, nombre o correo" maxlength="100" (input)="texto.set(b.value)" />
  </div>
  <div class="col-12 col-md-4">
    <label for="filtro-rol" class="visually-hidden">Rol</label>
    <select #r id="filtro-rol" class="form-select" (change)="rol.set($any(r.value))">
      <option value="">Todos los roles</option>
      <option value="ADMIN">ADMIN</option>
      <option value="USUARIO">USUARIO</option>
    </select>
  </div>
</div>

<div class="table-responsive card panel">
  <table class="table table-hover align-middle mb-0">
    <thead>
      <tr>
        <th scope="col">Usuario</th>
        <th scope="col" class="d-none d-md-table-cell">Correo</th>
        <th scope="col" class="d-none d-lg-table-cell">Registro</th>
        <th scope="col">Rol</th>
        <th scope="col" class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody>
      @for (u of lista(); track u.id) {
        <tr>
          <td>
            <strong>{{ u.username }}</strong>
            <div class="small text-secondary">{{ u.nombre }}</div>
          </td>
          <td class="d-none d-md-table-cell">{{ u.email }}</td>
          <td class="d-none d-lg-table-cell">{{ u.fechaCreacion | date: 'dd-MM-yyyy' }}</td>
          <td>
            <label class="visually-hidden" [for]="'rol-' + u.id">Rol de {{ u.username }}</label>
            <select #sel [id]="'rol-' + u.id" class="form-select form-select-sm w-auto" [value]="u.rol" (change)="cambiarRol(u, sel.value, sel)">
              <option value="USUARIO">USUARIO</option>
              <option value="ADMIN">ADMIN</option>
            </select>
          </td>
          <td class="text-end">
            <button class="btn btn-outline-danger btn-sm" type="button" (click)="eliminar(u)" [attr.aria-label]="'Eliminar ' + u.username">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      } @empty {
        <tr><td colspan="5" class="text-center text-secondary py-4">No hay usuarios que coincidan.</td></tr>
      }
    </tbody>
  </table>
</div>
