server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Aplicación de una sola página: las rutas de Angular (/login, /temas/1...) devuelven index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos con hash en el nombre pueden guardarse en caché por mucho tiempo
    location ~* \.(?:js|css|woff2?|svg)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
