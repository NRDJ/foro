spring.application.name=ms-moderacion
server.port=8083

# Oracle XE local (cada valor se puede cambiar con una variable de entorno).
# DB_URL permite usar otra base, por ejemplo Oracle Cloud con Wallet.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}}
spring.datasource.username=${DB_USER:FORO}
spring.datasource.password=${DB_PASSWORD:foro_local_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas las crea database/02_esquema_y_datos.sql; Hibernate solo verifica que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Misma clave en todos los microservicios: los tokens los emite ms-usuarios.
# El valor por defecto es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:clave-local-solo-para-desarrollo-foro-2026}
app.jwt.issuer=ms-usuarios

# URL de ms-foros, al que se le pide ocultar o restaurar contenido.
app.foros.url=${FOROS_URL:http://localhost:8082}
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=5s

app.cors.origen=${CORS_ORIGEN:http://localhost:4200}

management.endpoints.web.exposure.include=health

logging.level.root=INFO
logging.level.com.duoc.foro=DEBUG
