## Velocity: $d imprime un $ literal para los placeholders de Spring con valor por defecto.
#set( $d = '$' )
spring.application.name=${artifactId}
server.port=${puerto}

# Oracle XE local (cada valor se puede cambiar con una variable de entorno).
# DB_URL permite usar otra base, por ejemplo Oracle Cloud con Wallet.
spring.datasource.url=${d}{DB_URL:jdbc:oracle:thin:@//${d}{DB_HOST:localhost}:${d}{DB_PORT:1521}/${d}{DB_SERVICE:XEPDB1}}
spring.datasource.username=${d}{DB_USER:FORO}
spring.datasource.password=${d}{DB_PASSWORD:foro_local_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas las crea database/02_esquema_y_datos.sql; Hibernate solo verifica que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Misma clave en todos los microservicios: los tokens los emite ms-usuarios.
# El valor por defecto es solo para desarrollo local.
app.jwt.secret=${d}{JWT_SECRET:clave-local-solo-para-desarrollo-foro-2026}
app.jwt.issuer=ms-usuarios

app.cors.origen=${d}{CORS_ORIGEN:http://localhost:4200}

management.endpoints.web.exposure.include=health

logging.level.root=INFO
logging.level.com.duoc.foro=DEBUG
