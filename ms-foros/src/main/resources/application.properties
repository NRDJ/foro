spring.application.name=ms-foros
server.port=8082

# Oracle XE local (cada valor se puede cambiar con una variable de entorno)
spring.datasource.url=jdbc:oracle:thin:@//${DB_HOST:localhost}:${DB_PORT:1521}/${DB_SERVICE:XEPDB1}
spring.datasource.username=${DB_USER:FORO}
spring.datasource.password=${DB_PASSWORD:foro_local_2026}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Las tablas las crea database/02_esquema_y_datos.sql; Hibernate solo verifica que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Misma clave que ms-usuarios: asi se verifican aqui los tokens emitidos alla.
# El valor por defecto es solo para desarrollo local.
app.jwt.secret=${JWT_SECRET:clave-local-solo-para-desarrollo-foro-2026}
app.jwt.issuer=ms-usuarios

app.cors.origen=${CORS_ORIGEN:http://localhost:4200}

management.endpoints.web.exposure.include=health

logging.level.root=INFO
logging.level.com.duoc.foro=DEBUG
